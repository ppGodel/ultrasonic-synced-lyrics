plugins {
    alias libs.plugins.ksp
}

apply plugin: 'com.android.application'
apply plugin: "androidx.navigation.safeargs.kotlin"
apply from: "../gradle_scripts/code_quality.gradle"

def getGitCommitHash() {
    // CI_COMMIT_SHORT_SHA is set by GitLab CI; fall back to git for local builds
    def ciSha = System.getenv('CI_COMMIT_SHORT_SHA')
    if (ciSha) return ciSha
    def stdout = new ByteArrayOutputStream()
    try {
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return 'unknown'
    }
}

android {
    compileSdkVersion rootProject.ext.versions.compileSdk

    defaultConfig {
        applicationId "org.moire.ultrasonic"
        versionCode 131
        versionName "4.9.0"

        minSdkVersion rootProject.ext.versions.minSdk
        targetSdkVersion rootProject.ext.versions.targetSdk
        resourceConfigurations += ['cs', 'de', 'en', 'es', 'fr', 'gl', 'hu', 'it', 'ja', 'nb-rNO', 'nl', 'pl', 'pt', 'pt-rBR', 'ru', 'zh-rCN', 'zh-rTW']
        buildConfigField 'String', 'GIT_COMMIT', '""'
    }

    bundle.language.enableSplit = false

    signingConfigs {
        debugStable {
            storeFile file(System.getenv("DEBUG_KEYSTORE_PATH") ?: rootProject.file("debug.keystore"))
            storePassword System.getenv("DEBUG_KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("DEBUG_KEY_ALIAS") ?: "ultrasonic-debug"
            keyPassword System.getenv("DEBUG_KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'minify/proguard-main.pro',
                    'minify/proguard-okhttp.pro',
                    'minify/proguard-retrofit.pro',
                    'minify/proguard-jackson.pro',
                    'minify/proguard-kotlin-reflect.pro',
                    'minify/proguard-kotlin.pro',
                    'minify/proguard-coil.pro'
        }
        debug {
            signingConfig signingConfigs.debugStable
            minifyEnabled = false
            applicationIdSuffix = '.debug'
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
            buildConfigField 'String', 'GIT_COMMIT', "\"${getGitCommitHash()}\""
        }
    }

    sourceSets {
        main.java.srcDirs += "${projectDir}/src/main/kotlin"
        test.java.srcDirs += "${projectDir}/src/test/kotlin"
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE']
        }
    }

    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }

    ksp {
        arg("room.schemaLocation", "$rootDir/ultrasonic/schemas")
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = true
        warningsAsErrors = true
        warning 'ImpliedQuantity'
        disable 'IconMissingDensityFolder', 'VectorPath'
        disable 'MissingTranslation', 'UnusedQuantity', 'MissingQuantity'
        disable 'ObsoleteLintCustomCheck'
        // We manage dependencies on Gitlab with RenovateBot
        disable 'GradleDependency'
        disable 'NewerVersionAvailable'
        disable 'AndroidGradlePluginVersion'
        textReport = true
        checkDependencies = true
    }
    namespace = 'org.moire.ultrasonic'

}

