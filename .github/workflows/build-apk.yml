name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Cache the debug keystore so every build uses the same signing key.
      # The cache key is fixed (v1); to rotate the key, bump v1 → v2.
      - name: Restore debug keystore from cache
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-stable-v1

      - name: Generate debug keystore (first run only)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair \
            -alias ultrasonic-debug \
            -keystore debug.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Ultrasonic Debug,OU=Debug,O=ppGodel,L=MTY,S=NL,C=MX"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3200m -Xms256m -XX:MaxMetaspaceSize=1g"
          DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          DEBUG_KEYSTORE_PASSWORD: android
          DEBUG_KEY_ALIAS: ultrasonic-debug
          DEBUG_KEY_PASSWORD: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultrasonic-synced-lyrics-debug
          path: ultrasonic/build/outputs/apk/debug/*.apk
          retention-days: 30
